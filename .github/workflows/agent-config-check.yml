name: Ruseact CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Trusted base commit for a manually dispatched validation"
        required: false
        type: string
      head_sha:
        description: "Commit to validate for a manually dispatched validation"
        required: false
        type: string
permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check WASM target
        run: cargo check --workspace --target wasm32-unknown-unknown --locked

  typescript:
    name: TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript checks
        run: pnpm typecheck
      - name: Compiler unit and snapshot checks
        run: pnpm test:compiler

  browser:
    name: Browser (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Verify Chromium
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --version
      - name: Build release WASM
        run: cargo build -p ruseact-wasm --target wasm32-unknown-unknown --release --locked
      - name: Generate browser WASM bindings
        run: |
          mkdir -p target/m2.4-browser-bindgen
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/ruseact_wasm.wasm \
            --target web \
            --out-dir target/m2.4-browser-bindgen
      - name: Run real Chromium integration
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser
      - name: Run real Chromium DOM host tests
        run: pnpm test:browser:dom
      - name: Run real Chromium reactive DOM binding tests
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser:bindings
      - name: Run real Chromium root lifecycle tests
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser:root
      - name: Run real Chromium public renderer tests
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser:public
      - name: Run real Chromium compiled JSX tests
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser:compiler
      - name: Run real Chromium conditional structural tests
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser:conditional
      - name: Run real Chromium keyed-list structural tests
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser:keyed
      - name: Run real Chromium end-to-end DOM tests
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser:e2e

  benchmark:
    name: Benchmark (M2.5)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run benchmark calibration regression tests
        run: corepack pnpm test:benchmark:calibration
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build release WASM
        run: cargo build -p ruseact-wasm --target wasm32-unknown-unknown --release --locked
      - name: Generate Node and browser WASM bindings
        run: |
          mkdir -p target/m2.5-node-bindgen target/m2.5-browser-bindgen
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/ruseact_wasm.wasm \
            --target nodejs \
            --out-dir target/m2.5-node-bindgen
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/ruseact_wasm.wasm \
            --target web \
            --out-dir target/m2.5-browser-bindgen
      - name: Run Node/WASM benchmark
        env:
          RUSEACT_WASM_BINDGEN_OUT: ${{ github.workspace }}/target/m2.5-node-bindgen
          RUSEACT_BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RUSEACT_RUST_VERSION: 1.99.0
          RUSEACT_WASM_BINDGEN_VERSION: 0.2.130
          RUSEACT_BENCHMARK_OUT: ${{ github.workspace }}/target/m2.5-results/node-results.json
          RUSEACT_BENCHMARK_SUMMARY_OUT: ${{ github.workspace }}/target/m2.5-results/node-summary.md
        run: |
          mkdir -p target/m2.5-results
          corepack pnpm benchmark:node
      - name: Run real Chromium benchmark
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.5-browser-bindgen
          RUSEACT_BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RUSEACT_BENCHMARK_OUT: ${{ github.workspace }}/target/m2.5-results/browser-results.json
          RUSEACT_BENCHMARK_SUMMARY_OUT: ${{ github.workspace }}/target/m2.5-results/browser-summary.md
        run: corepack pnpm benchmark:browser
      - name: Print benchmark summaries before integrity gate
        run: |
          cat target/m2.5-results/node-summary.md
          cat target/m2.5-results/browser-summary.md
      - name: Validate benchmark result formats
        run: corepack pnpm benchmark:validate -- target/m2.5-results/node-results.json target/m2.5-results/browser-results.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruseact-m2.5-benchmark-${{ github.event.pull_request.head.sha }}
          path: target/m2.5-results
          if-no-files-found: warn
          retention-days: 14
      - name: Run real Chromium M3.5 DOM benchmark
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.5-browser-bindgen
          RUSEACT_BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RUSEACT_PNPM_VERSION: 12.16.1
          RUSEACT_RUST_VERSION: 1.99.0
          RUSEACT_TYPESCRIPT_VERSION: 5.9.3
          RUSEACT_WASM_BINDGEN_VERSION: 0.2.130
          RUSEACT_M35_BENCHMARK_OUT: ${{ github.workspace }}/target/m3.5-results/dom-results.json
          RUSEACT_M35_BENCHMARK_SUMMARY_OUT: ${{ github.workspace }}/target/m3.5-results/dom-summary.md
        run: |
          mkdir -p target/m3.5-results
          corepack pnpm benchmark:browser:dom
      - name: Validate M3.5 DOM benchmark results
        run: corepack pnpm benchmark:dom:validate target/m3.5-results/dom-results.json
      - name: Upload M3.5 DOM benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruseact-m3.5-dom-benchmark-${{ github.event.pull_request.head.sha }}
          path: target/m3.5-results
          if-no-files-found: warn
          retention-days: 14
      - name: Run M4.4.4 keyed-list benchmark
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.5-browser-bindgen
          RUSEACT_BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RUSEACT_PNPM_VERSION: 12.16.1
          RUSEACT_RUST_VERSION: 1.99.0
          RUSEACT_TYPESCRIPT_VERSION: 5.9.3
          RUSEACT_WASM_BINDGEN_VERSION: 0.2.130
          RUSEACT_KEYED_BENCHMARK_OUT: ${{ github.workspace }}/target/m4.4.4-results/keyed-results.json
          RUSEACT_KEYED_BENCHMARK_SUMMARY_OUT: ${{ github.workspace }}/target/m4.4.4-results/keyed-summary.md
        run: |
          mkdir -p target/m4.4.4-results
          corepack pnpm benchmark:browser:keyed
      - name: Validate M4.4.4 keyed-list benchmark
        run: corepack pnpm benchmark:keyed:validate target/m4.4.4-results/keyed-results.json
      - name: Upload M4.4.4 keyed-list benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruseact-m4.4.4-keyed-benchmark-${{ github.event.pull_request.head.sha }}
          path: target/m4.4.4-results
          if-no-files-found: warn
          retention-days: 14

  skills:
    name: Skill validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 scripts/validate_skills.py
      - name: Test workflow policy
        run: |
          python3 scripts/test_workflow_policy.py
          python3 scripts/test_automation_gate.py
      - name: Branch resume helper smoke test
        run: |
          python3 .agents/skills/ruseact-branch-resume/scripts/resume.py status
          python3 .agents/skills/ruseact-branch-resume/scripts/resume.py plan

  readme:
    name: README documentation
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.base_sha != '' && inputs.head_sha != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a meaningful root README update
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
        run: python3 scripts/validate_readme_update.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

  risk:
    name: Risk classification
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.base_sha != '' && inputs.head_sha != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
        run: python3 scripts/classify_changed_files.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
