name: Ruseact Auto Merge Develop

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Ruseact CI"]
    types: [completed]

# This workflow is privileged, so it checks out only the trusted default-branch policy.
# It never executes files from the pull-request head.
permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: ruseact-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify auto-merge eligibility
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != '')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      risk: ${{ steps.policy.outputs.risk }}
      reason: ${{ steps.policy.outputs.reason }}
      head_sha: ${{ steps.policy.outputs.head_sha }}
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Evaluate trusted repository gates
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: >-
          python3 scripts/automation_gate.py
          --mode auto-merge
          --pr-number "$PR_NUMBER"
          --output "$GITHUB_OUTPUT"
      - name: Record gate decision
        if: always()
        env:
          RISK: ${{ steps.policy.outputs.risk }}
          REASON: ${{ steps.policy.outputs.reason }}
        run: |
          {
            echo "### Develop auto-merge gate"
            echo "- Risk: ${RISK:-UNKNOWN}"
            echo "- Decision: ${REASON:-gate did not produce a decision}"
          } >> "$GITHUB_STEP_SUMMARY"

  enable-native-squash-auto-merge:
    name: Enable native squash auto-merge
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the PR revision did not change
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.gate.outputs.head_sha }}
          PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          actual_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$actual_head" = "$EXPECTED_HEAD" || {
            echo "PR revision changed after gate evaluation; refusing auto-merge" >&2
            exit 1
          }
      - name: Enable GitHub-native squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
