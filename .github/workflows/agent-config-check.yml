name: Ruseact CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Trusted base commit for a manually dispatched validation"
        required: false
        type: string
      head_sha:
        description: "Commit to validate for a manually dispatched validation"
        required: false
        type: string
permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check WASM target
        run: cargo check --workspace --target wasm32-unknown-unknown --locked

  typescript:
    name: TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript checks
        run: pnpm typecheck

  browser:
    name: Browser (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Verify Chromium
        run: |
          BROWSER="$(command -v chromium || command -v google-chrome || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --version
      - name: Build release WASM
        run: cargo build -p ruseact-wasm --target wasm32-unknown-unknown --release --locked
      - name: Generate browser WASM bindings
        run: |
          mkdir -p target/m2.4-browser-bindgen
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/ruseact_wasm.wasm \
            --target web \
            --out-dir target/m2.4-browser-bindgen
      - name: Run real Chromium integration
        env:
          RUSEACT_BROWSER_BINDGEN_OUT: ${{ github.workspace }}/target/m2.4-browser-bindgen
        run: pnpm test:browser

  skills:
    name: Skill validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 scripts/validate_skills.py
      - name: Test workflow policy
        run: |
          python3 scripts/test_workflow_policy.py
          python3 scripts/test_automation_gate.py
      - name: Branch resume helper smoke test
        run: |
          python3 .agents/skills/ruseact-branch-resume/scripts/resume.py status
          python3 .agents/skills/ruseact-branch-resume/scripts/resume.py plan

  readme:
    name: README documentation
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.base_sha != '' && inputs.head_sha != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a meaningful root README update
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
        run: python3 scripts/validate_readme_update.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

  risk:
    name: Risk classification
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.base_sha != '' && inputs.head_sha != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
        run: python3 scripts/classify_changed_files.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
